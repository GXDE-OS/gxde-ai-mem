plugins {
    id 'java'
    id 'checkstyle'
    id 'com.diffplug.spotless' version '8.11.0'
}

group = 'top.gxde.ai'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

spotless {
    java {
        target 'src/**/*.java'
        googleJavaFormat()
        removeUnusedImports()
        formatAnnotations()
        trimTrailingWhitespace()
        endWithNewline()
        toggleOffOn()
    }
    format 'misc', {
        target '*.gradle', '*.md', '.editorconfig', '.gitignore'
        trimTrailingWhitespace()
        endWithNewline()
    }
}

checkstyle {
    toolVersion = '14.4.0'
    configFile = file('config/checkstyle/checkstyle.xml')
    maxWarnings = 0
    maxErrors = 0
}

tasks.withType(Checkstyle).configureEach {
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.named('check') {
    dependsOn 'spotlessCheck'
}
